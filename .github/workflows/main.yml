name: Auto-merge exercism-bot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run for PRs opened by exercism-bot. GitHub Apps that post as bots
    # typically show up as "<name>[bot]" or, for exercism-bot specifically,
    # as the literal login "exercism-bot" - verify the exact login on the
    # actual PRs you receive before relying on this condition.
    if: github.event.pull_request.user.login == 'exercism-bot'
    steps:
      - name: Approve pull request
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
